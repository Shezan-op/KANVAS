name: Feature request
description: Suggest a template, layout, integration or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to make?
      description: Describe the carousel or workflow, not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Editor, Templates and design, Photos, Export, AI agents / MCP, Other]
